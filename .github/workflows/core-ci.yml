name: Core CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  core:
    name: Restore, build, and test Core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NUGET_PACKAGES: ${{ runner.temp }}/sharpclaw-core-nuget/packages
      NUGET_HTTP_CACHE_PATH: ${{ runner.temp }}/sharpclaw-core-nuget/http-cache

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure the isolated package source map
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ci" "$NUGET_PACKAGES" "$NUGET_HTTP_CACHE_PATH"
          cat > "$GITHUB_WORKSPACE/.ci/NuGet.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF

      - name: Restore
        run: dotnet restore SharpClaw.Core.slnx --configfile "$GITHUB_WORKSPACE/.ci/NuGet.config"

      - name: Build
        run: dotnet build SharpClaw.Core.slnx --configuration Release --no-restore

      - name: Run direct-turn streaming tests
        run: >-
          dotnet test SharpClaw.Core.Tests/SharpClaw.Core.Tests.csproj
          --configuration Release --no-build
          --filter FullyQualifiedName~KernelDirectTurnStreamingTests

      - name: Run maintained Core tests
        run: >-
          dotnet test SharpClaw.Core.slnx
          --configuration Release --no-build
